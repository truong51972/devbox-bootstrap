name: Shell validation

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning -e SC1090,SC1091
      - name: Run smoke tests
        run: |
          bash tests/smoke.sh
          bash tests/cli.sh
          bash tests/config.sh
          bash tests/docker.sh
          bash tests/hardening.sh
          bash tests/upgrade.sh
