name: Shell validation

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: ShellCheck
        run: find . -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning -e SC1090,SC1091
      - name: Run smoke tests
        run: |
          bash tests/smoke.sh
          bash tests/cli.sh
          bash tests/config.sh
          bash tests/docker.sh
          bash tests/hardening.sh
          bash tests/upgrade.sh
          bash tests/upgrade-binary.sh
          bash tests/tui-launcher.sh
          bash tests/tui-runtime.sh
          bash tests/tui-events.sh
      - name: Test Python TUI
        run: |
          python3 -m venv "$RUNNER_TEMP/devbox-tui-venv"
          "$RUNNER_TEMP/devbox-tui-venv/bin/python" -m pip install --disable-pip-version-check -r tui/requirements.txt
          "$RUNNER_TEMP/devbox-tui-venv/bin/python" -m compileall -q tui
          "$RUNNER_TEMP/devbox-tui-venv/bin/python" -m unittest discover -s tests -p 'test_tui.py' -v
